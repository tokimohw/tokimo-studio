<main>
  <section class="connect-section fade-up">
    <div class="section-inner">
      <div class="connect-layout">
        <div class="connect-info">
          <span class="hero-label" data-i18n="c-hero-label">Get in Touch</span>
          <h1 class="display-title" data-i18n="c-display-title">Start a <br>Conversation.</h1>
          <p class="description" data-i18n="c-description">
            프로젝트 의뢰 및 협업 문의는 아래 양식을 통해 접수해 주세요.
          </p>
        </div>

        <form class="connect-form" id="contact-form">
          <div class="input-wrapper">
            <label for="name" data-i18n="c-label-name">Name / Organization</label>
            <input type="text" id="name" name="name" placeholder="Your Name" data-i18n="c-ph-name" required>
          </div>
          
          <div class="input-wrapper">
            <label for="service" data-i18n="c-label-service">Service</label>
            <select id="service" name="service" required>
              <option value="" disabled selected data-i18n="c-opt-default">Select a service</option>
              <option value="web" data-i18n="c-opt-web">Web Development / UI Design</option>
              <option value="branding" data-i18n="c-opt-brand">Brand Identity / Personal Branding</option>
              <option value="consulting" data-i18n="c-opt-consult">Japan Entry Consulting</option>
              <option value="others" data-i18n="c-opt-others">Others</option>
            </select>
          </div>
          
          <div class="input-wrapper">
            <label for="budget" data-i18n="c-label-budget">Estimated Budget</label>
            <select id="budget" name="budget" required>
              <option value="" disabled selected data-i18n="c-opt-budget-default">Select budget range</option>
              <option value="under-30">~ 300,000 JPY (Small/Single)</option>
              <option value="30-70">300,000 - 700,000 JPY (Standard)</option>
              <option value="over-70">700,000 JPY + (Full Branding)</option>
            </select>
          </div>

          <div class="input-wrapper">
            <label for="timeline" data-i18n="c-label-timeline">Desired Timeline</label>
            <select id="timeline" name="timeline" required>
              <option value="" disabled selected data-i18n="c-opt-time-default">Select timeline</option>
              <option value="urgent" data-i18n="c-opt-time-1">Urgent (Within 1 month)</option>
              <option value="standard" data-i18n="c-opt-time-2">Standard (1-3 months)</option>
              <option value="flexible" data-i18n="c-opt-time-3">Flexible / Planning</option>
            </select>
          </div>

          <div class="input-wrapper">
            <label for="message" data-i18n="c-label-message">Message</label>
            <textarea id="message" name="message" rows="4" placeholder="Tell me about your project" data-i18n="c-ph-message" required></textarea>
          </div>

          
          <button type="submit" class="submit-btn">
            <span data-i18n="c-btn-submit">Send Inquiry <span class="arrow">→</span></span>
          </button>
        </form>
      </div>
    </div>
  </section>
</main>
